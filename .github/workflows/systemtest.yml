name: systemtest

# Release channel only — nightly cron + manual trigger; results are pushed to
# SigNoz over OTLP by the runner. The automatic staging channel
# (repository_dispatch on an image push) arrives in a later phase.
on:
  schedule:
    # 02:30 UTC nightly — installs the currently published Cosy from scratch.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run was triggered (shows up in the run log)"
        required: false
        default: "manual run"
      # Version pinning: verify a fix BEFORE it is released. install_cosy.sh takes
      # --backend-tag / --frontend-tag / --config-ref (Cosy PR #75); each input is
      # passed through only when non-empty, so an untouched form installs exactly
      # the pinned, published versions (release channel).
      backend_tag:
        description: "Backend ghcr image tag, e.g. `sha-abc1234`; leave empty to test the released pinned version"
        required: false
        default: ""
      frontend_tag:
        description: "Frontend ghcr image tag, e.g. `sha-abc1234`; leave empty to test the released pinned version"
        required: false
        default: ""
      config_ref:
        description: "Git ref of Magenta-Mause/Cosy the compose/config files are fetched from, e.g. `main`; leave empty to use the installer default"
        required: false
        default: ""

# Release runs must not cancel each other: a nightly and a manual run should both
# complete rather than the newer one killing the older (unlike staging later).
concurrency:
  group: systemtest-release
  cancel-in-progress: false

jobs:
  systemtest:
    runs-on: ubuntu-latest
    # Whole job budget; a healthy run is ~25-40 min, install + pull included.
    timeout-minutes: 60

    env:
      # Where install_cosy.sh (docker) puts everything by default.
      INSTALL_DIR: /opt/cosy
      COSY_BASE_URL: http://localhost:8080
      # COSY_CHANNEL is deliberately NOT set here: a job-level `env` value would
      # shadow anything a step writes to $GITHUB_ENV. The "Install Cosy" step sets
      # it to `release` or `staging` depending on whether a tag override was given.
      #
      # Public host serving the uploaded Playwright reports. Job-level on purpose:
      # the SUITE step bakes the URL into results/summary.json (that is where
      # `reportUrl` is computed) and the upload step logs it, and no step writes
      # this name to $GITHUB_ENV, so there is nothing for a job-level value to
      # shadow. Setting it on the push step alone would silently do nothing.
      REPORTS_BASE_URL: ${{ vars.REPORTS_BASE_URL || 'https://systemtest-reports.jannekeipert.de' }}

    steps:
      - name: Log trigger reason
        run: |
          echo "Trigger: ${{ github.event_name }} - ${{ github.event.inputs.reason || 'scheduled' }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      # No pre-built runner image on purpose: `playwright install` keeps the browser
      # in lockstep with the pinned @playwright/test version (image-tag drift was a
      # known 100%-red failure mode in the sibling repo).
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Fetch the installer exactly as a real user would (release channel = main).
      - name: Download install_cosy.sh
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Magenta-Mause/Cosy/main/install_cosy.sh \
            -o install_cosy.sh

      # Install Cosy from scratch, teeing stdout so the suite can parse the printed
      # admin credentials. We capture the installer's exit code WITHOUT letting the
      # pipe (pipefail is on by default here) abort the job — the health poll below
      # is our real gate, since the script's own 180s cap is the known flakiness.
      #
      # The optional workflow_dispatch tag overrides are appended as flags ONLY when
      # non-empty (an empty `--backend-tag ''` would install a nonexistent image), and
      # they are read from step env rather than interpolated into the script, so an
      # input can never break out of the argument list. Any override means we are no
      # longer testing the published product: the channel flips to `staging`.
      - name: Install Cosy
        env:
          INPUT_BACKEND_TAG: ${{ inputs.backend_tag }}
          INPUT_FRONTEND_TAG: ${{ inputs.frontend_tag }}
          INPUT_CONFIG_REF: ${{ inputs.config_ref }}
        run: |
          args=(docker --default --port 8080 --domain localhost)
          channel="release"

          if [ -n "$INPUT_BACKEND_TAG" ]; then
            args+=(--backend-tag "$INPUT_BACKEND_TAG")
            channel="staging"
          fi
          if [ -n "$INPUT_FRONTEND_TAG" ]; then
            args+=(--frontend-tag "$INPUT_FRONTEND_TAG")
            channel="staging"
          fi
          if [ -n "$INPUT_CONFIG_REF" ]; then
            args+=(--config-ref "$INPUT_CONFIG_REF")
            channel="staging"
          fi

          echo "Channel: ${channel}"
          echo "Installer arguments: ${args[*]}"
          echo "COSY_CHANNEL=${channel}" >> "$GITHUB_ENV"

          set +e
          sudo bash install_cosy.sh "${args[@]}" 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          set -e
          echo "Installer exited with code ${code}."
          echo "INSTALL_LOG=${GITHUB_WORKSPACE}/install.log" >> "$GITHUB_ENV"

      # Own health gate: poll for up to 10 minutes rather than trusting the script's
      # exit alone. Distinguish "degraded" (reachable but not UP) from "ok" per plan
      # 3.1; either way we proceed so the suite records the precise feature status.
      - name: Wait for stack health
        run: |
          deadline=$(( $(date +%s) + 600 ))
          status="unreachable"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -fsS "${COSY_BASE_URL}/api/actuator/health" 2>/dev/null || true)
            if echo "$body" | grep -q '"status":"UP"'; then
              status="ok"; break
            elif [ -n "$body" ]; then
              status="degraded"
            fi
            sleep 10
          done
          echo "Health status: ${status}"
          # Never fail here — install.spec is the source of truth for the install row.

      # The installed .env is root-owned + chmod 600, unreadable by the `runner`
      # user the suite runs as. Copy it to a runner-readable location instead of
      # chmod'ing the installed file — we must not mutate the state under test.
      # install.ts reads INSTALL_ENV_FILE in preference to ${INSTALL_DIR}/config/.env.
      - name: Expose .env to the test runner
        run: |
          sudo install -m 0644 -o "$(id -un)" /opt/cosy/config/.env "$RUNNER_TEMP/cosy-install.env"
          echo "INSTALL_ENV_FILE=$RUNNER_TEMP/cosy-install.env" >> "$GITHUB_ENV"

      # A stored result must say WHICH build it tested, otherwise a red row from a
      # pinned pre-release run is indistinguishable from a red released product. The
      # installer resolves the effective tags into the generated .env, so read them
      # back from there instead of echoing what we passed in (defaults included).
      - name: Record installed versions
        run: |
          # `|| true`: a missing key must yield "unknown", not abort the step under
          # `set -e`/`pipefail` (grep exits 1 when it matches nothing).
          read_tag() {
            grep -E "^$1=" "$INSTALL_ENV_FILE" | tail -n 1 | cut -d= -f2- || true
          }
          backend="$(read_tag BACKEND_IMAGE_TAG)"
          frontend="$(read_tag FRONTEND_IMAGE_TAG)"
          [ -n "$backend" ] || backend="unknown"
          [ -n "$frontend" ] || frontend="unknown"

          echo "Installed backend image tag:  ${backend}"
          echo "Installed frontend image tag: ${frontend}"
          echo "Channel: ${COSY_CHANNEL:-release}"

          # Consumed by scripts/run-systemtest.ts → results/summary.json (versions).
          echo "COSY_BACKEND_TAG=${backend}" >> "$GITHUB_ENV"
          echo "COSY_FRONTEND_TAG=${frontend}" >> "$GITHUB_ENV"

      # Warm the game-server image BEFORE the suite. Two reasons:
      #  1. No spec then pays for a cold pull, so the server-start budgets measure the
      #     product rather than Docker Hub's throughput.
      #  2. Docker Hub anonymously rate-limits by IP and GitHub runners share egress
      #     IPs. Without this step a `toomanyrequests` reply lands INSIDE the backend,
      #     where it surfaces as several servers stuck in a start state — i.e. four
      #     mystery-red features. Here it is an unmissable infrastructure failure with
      #     the registry's own message, which is what a rate-limit actually is.
      # Retried, because a single transient registry blip must not red the nightly.
      - name: Pre-pull game-server image
        run: |
          image="halftheopposite/tosios:latest"
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              echo "Pulled ${image} on attempt ${attempt}."
              exit 0
            fi
            echo "Pull attempt ${attempt} for ${image} failed; retrying in 15s."
            sleep 15
          done
          echo "::error::Could not pull ${image} after 3 attempts — INFRASTRUCTURE failure, \
          not a Cosy defect. Docker Hub rate limiting (toomanyrequests) on a shared runner IP \
          is the usual cause; check the pull output above. Every server spec would be red."
          exit 1

      # Metrics-are-truth: this step exits 0 even when features fail. It fails only
      # on an infrastructure error — Playwright produced no parseable report.
      #
      # `--no-push`: this step only WRITES results/summary.json (including the real
      # per-feature start/end timestamps the trace is laid out on). The push happens
      # in the "Push results to SigNoz" step below, after the teardown assertion
      # appended the `uninstall` row — otherwise the dashboard and the trace would see
      # 19 of 20 features. The summary is written whether features pass or fail, so
      # that later step always has something to push. No ingest credentials here.
      - name: Run systemtest suite
        run: npx tsx scripts/run-systemtest.ts --no-push

      # Stack diagnostics BEFORE uninstall (which destroys the evidence). Several
      # specs have failed in ways that point at the STACK degrading mid-run rather
      # than at product bugs — webhooks died with a bare `TypeError: fetch failed`
      # (backend unreachable at that moment) and server-lifecycle found a server
      # wedged in STOPPING for 300s. We cannot tell resource exhaustion (disk full,
      # RAM pressure, OOM-killer reaping a container) from a real product bug without
      # the host + container state at the end of the run, so capture it every time.
      - name: Capture stack diagnostics
        if: always()
        run: |
          set +e
          mkdir -p results/diagnostics
          d=results/diagnostics

          docker ps -a                     > "$d/docker-ps.txt" 2>&1
          docker stats --no-stream         > "$d/docker-stats.txt" 2>&1
          df -h                            > "$d/df.txt" 2>&1
          free -m                          > "$d/free.txt" 2>&1
          # FULL backend log, not a tail. Run 18's `--tail 400` captured 0.34 SECONDS
          # of wall time (a single template-refresh stack trace burns ~260 lines), so
          # the decisive "Error in Docker event listener" line — logged once, near the
          # moment the backend went blind — fell outside the window and the root cause
          # had to be inferred. The whole log of a ~1 h run is a few MB; that is cheap
          # next to the traces/videos we already upload.
          docker logs cosy-backend              > "$d/cosy-backend.log" 2>&1
          docker logs cosy-database --tail 500  > "$d/cosy-database.log" 2>&1
          journalctl -u docker --no-pager 2>/dev/null | tail -2000 > "$d/journal-docker.txt" 2>&1

          # THE failure mode to look for first (see docs/KNOWN-ISSUES.md): the backend
          # derives RUNNING/STOPPED solely from one Docker /events subscription that is
          # never restarted. When it dies, every server freezes in AWAITING_UPDATE or
          # STOPPING while its container is demonstrably fine. Extract the evidence
          # into its own file so a red night is diagnosable at a glance.
          grep -n -A 20 "Error in Docker event listener" "$d/cosy-backend.log" \
            > "$d/docker-event-stream-errors.txt" 2>&1
          if [ -s "$d/docker-event-stream-errors.txt" ]; then
            echo "::warning::Backend lost its Docker event stream during this run \
          — server statuses freeze in AWAITING_UPDATE/STOPPING. See \
          results/diagnostics/docker-event-stream-errors.txt (PRODUCT bug, not a test flake)."
          fi

          # OOM-killer evidence: if the kernel reaped a container mid-run this is
          # where it shows up (and explains "fetch failed" / stuck STOPPING).
          sudo dmesg 2>/dev/null | tail -200 > "$d/dmesg.txt" 2>&1
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process|oom' \
            > "$d/dmesg-oom.txt" 2>&1

          echo "--- disk ---";        cat "$d/df.txt"
          echo "--- memory ---";      cat "$d/free.txt"
          echo "--- containers ---";  cat "$d/docker-ps.txt"
          echo "--- OOM matches ---"; cat "$d/dmesg-oom.txt"
          echo "--- docker event-stream errors ---"; cat "$d/docker-event-stream-errors.txt"
          exit 0

      - name: Download uninstall_cosy.sh
        if: always()
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Magenta-Mause/Cosy/main/uninstall_cosy.sh \
            -o uninstall_cosy.sh

      - name: Uninstall Cosy
        if: always()
        run: sudo bash uninstall_cosy.sh docker -y

      # Teardown is itself a tested feature: assert nothing is left behind and append
      # an `uninstall` row to the summary the runner wrote. The push step below runs
      # after this one, so that row reaches SigNoz along with every spec's row.
      - name: Assert clean teardown
        if: always()
        run: |
          start=$(date +%s)
          status="passed"

          leftover_containers=$(docker ps -a --format '{{.Names}}' | grep '^cosy-' || true)
          if [ -n "$leftover_containers" ]; then
            echo "FAIL: leftover cosy-* containers:"; echo "$leftover_containers"
            status="failed"
          fi

          # Named volumes defined by the compose stack (postgres-data, loki-data,
          # influx_data/config, caddy_data/config). Relies on the fresh-VM
          # assumption: nothing else on this runner creates these names, so any
          # survivor means the uninstaller left volumes behind.
          leftover_volumes=$(docker volume ls --format '{{.Name}}' \
            | grep -E 'postgres-data|loki-data|influx_|caddy_' || true)
          if [ -n "$leftover_volumes" ]; then
            echo "FAIL: leftover compose volumes:"; echo "$leftover_volumes"
            status="failed"
          fi

          if [ -d "${INSTALL_DIR}" ]; then
            echo "FAIL: install dir ${INSTALL_DIR} still exists."
            status="failed"
          fi

          # The uninstaller is supposed to remove the systemd service unit too.
          if [ -f /etc/systemd/system/cosy.service ]; then
            echo "FAIL: systemd unit /etc/systemd/system/cosy.service still exists."
            status="failed"
          fi

          duration=$(( $(date +%s) - start ))
          echo "uninstall assertion: ${status}"

          # Append the uninstall feature row (summary.json exists if the runner ran).
          if [ -f results/summary.json ]; then
            tmp=$(mktemp)
            jq --arg s "$status" --argjson d "$duration" \
              '.features += [{"feature":"uninstall","status":$s,"durationSeconds":$d}]' \
              results/summary.json > "$tmp" && mv "$tmp" results/summary.json
          fi

      # Publish the Playwright HTML report so a red row in SigNoz is one click from
      # the video and the trace of what actually happened, instead of a zip download
      # that expires in 14 days.
      #
      # The report directory is self-contained — `index.html`, the attachments under
      # `data/` (videos .webm, traces .zip, screenshots) and a bundled copy of the
      # trace viewer under `trace/`, all referenced relatively — so serving the
      # directory is enough; nothing has to be rewritten. Verified against a MinIO of
      # the deployed release: the report renders, videos play and the trace viewer
      # unpacks the trace, all from the hosted URL.
      #
      # WHERE: s3://cosy-systemtest-reports/<channel>/<run-id>/, served read-only at
      # ${REPORTS_BASE_URL}/<channel>/<run-id>/index.html. `run-systemtest.ts` derives
      # exactly that URL for `summary.json` → the `cosy.systemtest.report_url` resource
      # attribute, so keep the layout and the derivation in sync (buildReportUrl).
      #
      # BEFORE the SigNoz push, so the link is live by the time the metric carrying it
      # lands. `results/` — including the stack diagnostics, container logs and dmesg —
      # is deliberately NOT published here; it stays a private GitHub artifact. Only
      # the report, which shows a throwaway instance's UI, is public.
      #
      # NEVER FAILS THE JOB. Hosting is a convenience on top of the artifacts, which
      # are still uploaded below; turning a green product run red because an object
      # store was briefly unreachable would train everyone to ignore the colour. It is
      # loud instead — `::warning::` plus the reason — and the missing report is
      # self-evident from the 404 the dashboard link then gives. (Contrast the SigNoz
      # push, which DOES fail the job: that path is the signal itself, not a copy.)
      - name: Publish Playwright report
        if: always()
        env:
          MINIO_ENDPOINT: ${{ vars.MINIO_REPORTS_ENDPOINT || 'https://minio-cli.jannekeipert.de' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_REPORTS_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_REPORTS_SECRET_KEY }}
          # Pinned to the mc release the cluster's MinIO chart uses. The published
          # .sha256sum is verified — an unpinned installer script fetching an
          # unverified binary is not something a credential should be handed to.
          MC_VERSION: RELEASE.2024-11-21T17-21-54Z
        run: |
          set -uo pipefail

          if [ ! -d playwright-report ]; then
            echo "::warning::No playwright-report/ directory — nothing to publish. \
          The suite step must have died before Playwright wrote its HTML report."
            exit 0
          fi
          # Forks get no secrets; behave like the OTLP push and skip with an INFO line.
          if [ -z "${MINIO_ACCESS_KEY}" ] || [ -z "${MINIO_SECRET_KEY}" ]; then
            echo "INFO: MINIO_REPORTS_ACCESS_KEY / MINIO_REPORTS_SECRET_KEY are not set — \
          skipping report publication. Expected on forks; the artifacts below still carry \
          the full report."
            exit 0
          fi

          channel="${COSY_CHANNEL:-release}"
          target="${REPORTS_BASE_URL}/${channel}/${GITHUB_RUN_ID}/index.html"

          fail() {
            echo "::warning::Could not publish the Playwright report ($1). The report is \
          still attached to this run as the systemtest-report artifact; the dashboard's \
          report link (${target}) will 404 for this run."
            exit 0
          }

          base="https://dl.min.io/client/mc/release/linux-amd64/archive/mc.${MC_VERSION}"
          curl -fsSL --retry 3 --retry-delay 5 -o "mc.${MC_VERSION}" "${base}" || fail "mc download failed"
          curl -fsSL --retry 3 --retry-delay 5 -o "mc.${MC_VERSION}.sha256sum" "${base}.sha256sum" \
            || fail "mc checksum download failed"
          sha256sum -c "mc.${MC_VERSION}.sha256sum" || fail "mc checksum MISMATCH — refusing to run it"
          mv "mc.${MC_VERSION}" mc && chmod +x mc

          # Credentials arrive through the environment; `mc alias set` reads them from
          # there, so they never appear in a command line (visible in `ps`) or in the log.
          MC="./mc --config-dir ${RUNNER_TEMP}/mc"
          $MC alias set reports "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" \
            >/dev/null || fail "could not authenticate against ${MINIO_ENDPOINT}"

          dest="reports/cosy-systemtest-reports/${channel}/${GITHUB_RUN_ID}"
          # `--overwrite` so a re-run of the same GitHub run replaces its own report
          # rather than half-updating it; `--retry` for transient upload failures.
          for attempt in 1 2 3; do
            if $MC mirror --overwrite --retry --quiet playwright-report "${dest}"; then
              echo "Published report: ${target}"
              exit 0
            fi
            echo "Report upload attempt ${attempt}/3 failed; retrying in 10s."
            sleep 10
          done
          fail "3 upload attempts to ${dest} failed"

      # Push LAST, so the payload contains the complete matrix — every spec row plus
      # the `uninstall` row the teardown assertion just appended. Reads the summary the
      # suite step wrote; runs no tests. Two signals go out here: the per-feature
      # metrics AND one trace for the run (root span + one span per feature), sharing a
      # trace id that also rides on the metrics so the dashboard can link to it.
      #
      # `if: always()`, because a red suite is exactly when the dashboard must update.
      # A failed push is deliberately loud (non-zero + `::error::`): a reporting path
      # that breaks quietly means SigNoz goes stale and nobody notices.
      #
      # Accepted trade-off: if the JOB hits `timeout-minutes`, GitHub cancels the run and
      # every remaining step with it, so that run reports nothing (the artifact upload is
      # lost the same way). Acceptable now that the event-stream wedge is diagnosed in
      # ~45 s instead of 300 s × 3 retries × 4 specs — the ~46 min that cancelled run 18
      # (docs/KNOWN-ISSUES.md) is what made a mid-job cancellation likely at all — and a
      # run that never reports is visible as staleness in
      # `cosy_platform_systemtest_last_run_timestamp_seconds`. A belt-and-braces push
      # inside the suite step would buy that edge case at the price of double-reporting every
      # healthy night: two timestamps per run and two sets of feature points, the earlier
      # set missing `uninstall`, i.e. exactly the misleading matrix this step removes.
      #
      # Secrets are passed through `env:` and never interpolated into the shell command.
      # `OTEL_INGEST_URL` falls back to the known ingress host when the repo variable is
      # unset; if any of the three is missing (e.g. on a fork, where secrets are not
      # exposed) the runner skips the push and exits 0.
      - name: Push results to SigNoz
        if: always()
        env:
          OTEL_INGEST_URL: ${{ vars.OTEL_INGEST_URL || 'https://otel-ingest.jannekeipert.de' }}
          OTEL_INGEST_USER: ${{ secrets.OTEL_INGEST_USER }}
          OTEL_INGEST_PASSWORD: ${{ secrets.OTEL_INGEST_PASSWORD }}
        run: npx tsx scripts/run-systemtest.ts --push-only

      # Report + results always (14 days) so a red night is debuggable from the run.
      - name: Upload report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemtest-report
          path: |
            playwright-report/
            results/
          retention-days: 14

      # Always upload traces/videos: the runner exits 0 on red features by design
      # ("metrics are truth"), so the job stays green and `failure()` would never
      # fire exactly when specs go red — the case we most need traces for. With
      # trace:'on' + video:'on' a trace AND a watchable video.webm exist for every
      # run (green or red) under test-results/<test-dir>/, so this always contains
      # both — hence the artifact name. Watch a video by downloading it, or open
      # the HTML report (systemtest-report) which links each test to its video.
      - name: Upload traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemtest-report-traces-videos
          path: test-results/
          retention-days: 14

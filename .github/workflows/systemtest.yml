name: systemtest

# Release channel only — nightly cron, manual trigger, and a push to
# Magenta-Mause/Cosy's default branch; results are pushed to SigNoz over OTLP by
# the runner. The automatic staging channel (dispatch on an image push) arrives
# in a later phase.
on:
  schedule:
    # 02:30 UTC nightly — installs the currently published Cosy from scratch.
    - cron: "30 2 * * *"
  # Fired by Magenta-Mause/Cosy's trigger-systemtest.yml on every push to its
  # default branch — that repo owns install_cosy.sh and config/, so a change
  # there changes what a real install does. NOTE: repository_dispatch provides no
  # `inputs` context, so `inputs.*` below resolve to empty and the install runs
  # with no tag/ref overrides — i.e. exactly the release channel, which is the
  # point. Do not give these inputs non-empty defaults or that silently breaks.
  repository_dispatch:
    types: [cosy-main-changed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run was triggered (shows up in the run log)"
        required: false
        default: "manual run"
      # Version pinning: verify a fix BEFORE it is released. install_cosy.sh takes
      # --backend-tag / --frontend-tag / --config-ref (Cosy PR #75); each input is
      # passed through only when non-empty, so an untouched form installs exactly
      # the pinned, published versions (release channel).
      backend_tag:
        description: "Backend ghcr image tag, e.g. `sha-abc1234`; leave empty to test the released pinned version"
        required: false
        default: ""
      frontend_tag:
        description: "Frontend ghcr image tag, e.g. `sha-abc1234`; leave empty to test the released pinned version"
        required: false
        default: ""
      config_ref:
        description: "Git ref of Magenta-Mause/Cosy the compose/config files are fetched from, e.g. `main`; leave empty to use the installer default"
        required: false
        default: ""

# Release runs must not cancel each other: a nightly and a manual run should both
# complete rather than the newer one killing the older (unlike staging later).
concurrency:
  group: systemtest-release
  cancel-in-progress: false

jobs:
  systemtest:
    runs-on: ubuntu-latest
    # Whole job budget. A healthy run measured ~5 min end to end (run 31057482379:
    # ~45 s install, 3.0 min for all 21 tests, 20 passed / 1 skipped), so the 60 is
    # headroom for a bad night, not the expected cost. The old "~25-40 min" note here
    # dated from before the event-stream wedge was diagnosed, when specs sat in 300 s
    # retry loops; see docs/KNOWN-ISSUES.md.
    timeout-minutes: 60

    env:
      # Where install_cosy.sh (docker) puts everything by default.
      INSTALL_DIR: /opt/cosy
      COSY_BASE_URL: http://localhost:8080
      # COSY_CHANNEL is deliberately NOT set here: a job-level `env` value would
      # shadow anything a step writes to $GITHUB_ENV. The "Install Cosy" step sets
      # it to `release` or `staging` depending on whether a tag override was given.
      #
      # Public host serving the uploaded Playwright reports. Job-level on purpose:
      # the SUITE step bakes the URL into results/summary.json (that is where
      # `reportUrl` is computed) and the upload step logs it, and no step writes
      # this name to $GITHUB_ENV, so there is nothing for a job-level value to
      # shadow. Setting it on the push step alone would silently do nothing.
      # The suite step now lives inside .github/actions/run-systemtest, and job-level
      # env still reaches it — but ONLY because that action sets no REPORTS_BASE_URL of
      # its own (step env would shadow this). Do not add one there.
      REPORTS_BASE_URL: ${{ vars.REPORTS_BASE_URL || 'https://systemtest-reports.jannekeipert.de' }}

    steps:
      - name: Log trigger reason
        run: |
          echo "Trigger: ${{ github.event_name }} - ${{ github.event.inputs.reason || github.event.client_payload.reason || 'scheduled' }}"
          # repository_dispatch carries the Cosy commit that caused this run, so a
          # red here can be traced back to the change without opening the other repo.
          if [ -n "${{ github.event.client_payload.cosy_sha }}" ]; then
            echo "Triggered by Magenta-Mause/Cosy@${{ github.event.client_payload.cosy_sha }}"
            echo "  ${{ github.event.client_payload.cosy_compare }}"
          fi

      - uses: actions/checkout@v4

      # The install → suite → diagnostics → uninstall → teardown-assertion sequence
      # lives in a composite action because three workflows in three repositories need
      # it byte-for-byte: this nightly release run, and the PR gates in Cosy-Frontend
      # and cosy-backend, which build their PR's image locally and install THAT instead
      # of the published tag. See .github/actions/run-systemtest/action.yml for what
      # deliberately stays out here (short version: anything that needs a secret —
      # the MinIO publish and the SigNoz push below).
      #
      # The three tag/ref inputs are forwarded verbatim. On a `schedule` or a
      # `repository_dispatch` there is no `inputs` context at all, so they resolve to
      # empty and the installer installs the pinned, published versions — which IS the
      # release channel, and is exactly why they must never be given non-empty defaults.
      - name: Install Cosy and run the systemtest suite
        id: systemtest
        uses: ./.github/actions/run-systemtest
        with:
          backend-tag: ${{ inputs.backend_tag }}
          frontend-tag: ${{ inputs.frontend_tag }}
          config-ref: ${{ inputs.config_ref }}
          # Passed explicitly rather than relying on the job-level `env` above leaking
          # into the action: the action sets these as step env on the steps that need
          # them, and step env shadows job env, so an unpassed value would silently be
          # the action's default rather than what this block documents.
          install-dir: ${{ env.INSTALL_DIR }}
          base-url: ${{ env.COSY_BASE_URL }}

      # Publish the Playwright HTML report so a red row in SigNoz is one click from
      # the video and the trace of what actually happened, instead of a zip download
      # that expires in 14 days.
      #
      # The report directory is self-contained — `index.html`, the attachments under
      # `data/` (videos .webm, traces .zip, screenshots) and a bundled copy of the
      # trace viewer under `trace/`, all referenced relatively — so serving the
      # directory is enough; nothing has to be rewritten. Verified against a MinIO of
      # the deployed release: the report renders, videos play and the trace viewer
      # unpacks the trace, all from the hosted URL.
      #
      # WHERE: s3://cosy-systemtest-reports/<channel>/<run-id>/, served read-only at
      # ${REPORTS_BASE_URL}/<channel>/<run-id>/index.html. `run-systemtest.ts` derives
      # exactly that URL for `summary.json` → the `cosy.systemtest.report_url` resource
      # attribute, so keep the layout and the derivation in sync (buildReportUrl).
      #
      # BEFORE the SigNoz push, so the link is live by the time the metric carrying it
      # lands. `results/` — including the stack diagnostics, container logs and dmesg —
      # is deliberately NOT published here; it stays a private GitHub artifact. Only
      # the report, which shows a throwaway instance's UI, is public.
      #
      # NEVER FAILS THE JOB. Hosting is a convenience on top of the artifacts, which
      # are still uploaded below; turning a green product run red because an object
      # store was briefly unreachable would train everyone to ignore the colour. It is
      # loud instead — `::warning::` plus the reason — and the missing report is
      # self-evident from the 404 the dashboard link then gives. (Contrast the SigNoz
      # push, which DOES fail the job: that path is the signal itself, not a copy.)
      - name: Publish Playwright report
        if: always()
        env:
          MINIO_ENDPOINT: ${{ vars.MINIO_REPORTS_ENDPOINT || 'https://minio-cli.jannekeipert.de' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_REPORTS_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_REPORTS_SECRET_KEY }}
          # Pinned to the mc release the cluster's MinIO chart uses. The published
          # .sha256sum is verified — an unpinned installer script fetching an
          # unverified binary is not something a credential should be handed to.
          MC_VERSION: RELEASE.2024-11-21T17-21-54Z
        run: |
          set -uo pipefail

          if [ ! -d playwright-report ]; then
            echo "::warning::No playwright-report/ directory — nothing to publish. \
          The suite step must have died before Playwright wrote its HTML report."
            exit 0
          fi
          # Forks get no secrets; behave like the OTLP push and skip with an INFO line.
          if [ -z "${MINIO_ACCESS_KEY}" ] || [ -z "${MINIO_SECRET_KEY}" ]; then
            echo "INFO: MINIO_REPORTS_ACCESS_KEY / MINIO_REPORTS_SECRET_KEY are not set — \
          skipping report publication. Expected on forks; the artifacts below still carry \
          the full report."
            exit 0
          fi

          channel="${COSY_CHANNEL:-release}"
          target="${REPORTS_BASE_URL}/${channel}/${GITHUB_RUN_ID}/index.html"

          fail() {
            echo "::warning::Could not publish the Playwright report ($1). The report is \
          still attached to this run as the systemtest-report artifact; the dashboard's \
          report link (${target}) will 404 for this run."
            exit 0
          }

          base="https://dl.min.io/client/mc/release/linux-amd64/archive/mc.${MC_VERSION}"
          curl -fsSL --retry 3 --retry-delay 5 -o "mc.${MC_VERSION}" "${base}" || fail "mc download failed"
          curl -fsSL --retry 3 --retry-delay 5 -o "mc.${MC_VERSION}.sha256sum" "${base}.sha256sum" \
            || fail "mc checksum download failed"
          sha256sum -c "mc.${MC_VERSION}.sha256sum" || fail "mc checksum MISMATCH — refusing to run it"
          mv "mc.${MC_VERSION}" mc && chmod +x mc

          # Credentials arrive through the environment; `mc alias set` reads them from
          # there, so they never appear in a command line (visible in `ps`) or in the log.
          MC="./mc --config-dir ${RUNNER_TEMP}/mc"
          $MC alias set reports "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" \
            >/dev/null || fail "could not authenticate against ${MINIO_ENDPOINT}"

          dest="reports/cosy-systemtest-reports/${channel}/${GITHUB_RUN_ID}"
          # `--overwrite` so a re-run of the same GitHub run replaces its own report
          # rather than half-updating it; `--retry` for transient upload failures.
          for attempt in 1 2 3; do
            if $MC mirror --overwrite --retry --quiet playwright-report "${dest}"; then
              echo "Published report: ${target}"
              exit 0
            fi
            echo "Report upload attempt ${attempt}/3 failed; retrying in 10s."
            sleep 10
          done
          fail "3 upload attempts to ${dest} failed"

      # Push LAST, so the payload contains the complete matrix — every spec row plus
      # the `uninstall` row the teardown assertion just appended. Reads the summary the
      # suite step wrote; runs no tests. Two signals go out here: the per-feature
      # metrics AND one trace for the run (root span + one span per feature), sharing a
      # trace id that also rides on the metrics so the dashboard can link to it.
      #
      # `if: always()`, because a red suite is exactly when the dashboard must update.
      # A failed push is deliberately loud (non-zero + `::error::`): a reporting path
      # that breaks quietly means SigNoz goes stale and nobody notices.
      #
      # Accepted trade-off: if the JOB hits `timeout-minutes`, GitHub cancels the run and
      # every remaining step with it, so that run reports nothing (the artifact upload is
      # lost the same way). Acceptable now that the event-stream wedge is diagnosed in
      # ~45 s instead of 300 s × 3 retries × 4 specs — the ~46 min that cancelled run 18
      # (docs/KNOWN-ISSUES.md) is what made a mid-job cancellation likely at all — and a
      # run that never reports is visible as staleness in
      # `cosy_platform_systemtest_last_run_timestamp_seconds`. A belt-and-braces push
      # inside the suite step would buy that edge case at the price of double-reporting every
      # healthy night: two timestamps per run and two sets of feature points, the earlier
      # set missing `uninstall`, i.e. exactly the misleading matrix this step removes.
      #
      # Secrets are passed through `env:` and never interpolated into the shell command.
      # `OTEL_INGEST_URL` falls back to the known ingress host when the repo variable is
      # unset; if any of the three is missing (e.g. on a fork, where secrets are not
      # exposed) the runner skips the push and exits 0.
      - name: Push results to SigNoz
        if: always()
        env:
          OTEL_INGEST_URL: ${{ vars.OTEL_INGEST_URL || 'https://otel-ingest.jannekeipert.de' }}
          OTEL_INGEST_USER: ${{ secrets.OTEL_INGEST_USER }}
          OTEL_INGEST_PASSWORD: ${{ secrets.OTEL_INGEST_PASSWORD }}
        run: npx tsx scripts/run-systemtest.ts --push-only

      # Report + results always (14 days) so a red night is debuggable from the run.
      - name: Upload report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemtest-report
          path: |
            playwright-report/
            results/
          retention-days: 14

      # Always upload traces/videos: the runner exits 0 on red features by design
      # ("metrics are truth"), so the job stays green and `failure()` would never
      # fire exactly when specs go red — the case we most need traces for. With
      # trace:'on' + video:'on' a trace AND a watchable video.webm exist for every
      # run (green or red) under test-results/<test-dir>/, so this always contains
      # both — hence the artifact name. Watch a video by downloading it, or open
      # the HTML report (systemtest-report) which links each test to its video.
      - name: Upload traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemtest-report-traces-videos
          path: test-results/
          retention-days: 14
